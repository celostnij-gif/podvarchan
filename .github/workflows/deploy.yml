name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-site:
    name: Site (podvarchan.com)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      - name: ESLint check
        run: npm run lint

      - name: Build site
        run: npx opennextjs-cloudflare build && node scripts/patch-opennext-cache-headers.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADYZ2z3RysEsBoQu
          NEXTJS_ENV: production
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

      - name: IndexNow ping
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "podvarchan.com",
              "key": "8a43183f603f4adb9fd469d2fc5d7cef",
              "keyLocation": "https://podvarchan.com/8a43183f603f4adb9fd469d2fc5d7cef.txt",
              "urlList": ["https://podvarchan.com/sitemap.xml"]
            }'

      - name: Deploy site to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-admin:
    name: Admin (admin.podvarchan.com)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/admin && npm install --no-audit --no-fund

      - name: Build admin
        run: cd apps/admin && npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADYZ2z3RysEsBoQu
          NEXTJS_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

      - name: TypeScript check (admin)
        run: cd apps/admin && npx tsc --noEmit
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTJS_ENV: production

      - name: Invalidation coverage check
        run: node scripts/check-invalidation-coverage.mjs
      - name: Bundle size gate (admin)
        # Same ~3 MiB gzip platform ceiling as the public worker; 1.8/2.5 MiB
        # leaves realistic headroom for admin UI growth (current ~1.42 MiB)
        # without alerting on every PR. 1.5/2.0 MiB proved too tight (~5%).
        run: node scripts/check-bundle-size.mjs --path apps/admin/.open-next/server-functions/default/apps/admin/handler.mjs --warn 1887436 --fail 2621440

      - name: Deploy admin to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin
          command: deploy --no-autoconfig

      - name: Verify admin responds
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Cache-Control: no-cache" https://admin.podvarchan.com/)
          echo "admin.podvarchan.com -> $code"
          [[ "$code" != "000" ]] || { echo "FAIL: admin unreachable"; exit 1; }

