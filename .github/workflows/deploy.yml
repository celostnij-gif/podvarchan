name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-site:
    name: Site (podvarchan.com)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache-Control sync check (Phase 2.2)
        run: node scripts/check-cache-sync.mjs

      - name: ESLint check
        run: npm run lint

      - name: TypeScript check (site)
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXTJS_ENV: production

      - name: Build site
        run: npx opennextjs-cloudflare build && node scripts/patch-opennext-cache-headers.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADYZ2z3RysEsBoQu
          NEXTJS_ENV: production
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

      - name: Bundle size gate (site)
        run: node scripts/check-bundle-size.mjs --path .open-next/server-functions/default/handler.mjs --warn 2621440 --fail 3040870

      - name: IndexNow ping
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "podvarchan.com",
              "key": "8a43183f603f4adb9fd469d2fc5d7cef",
              "keyLocation": "https://podvarchan.com/8a43183f603f4adb9fd469d2fc5d7cef.txt",
              "urlList": ["https://podvarchan.com/sitemap.xml"]
            }'

      - name: Deploy site to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Purge zone cache after deploy (site)
        run: node scripts/purge-zone-cache.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Warm up sitemap URLs after deploy (AGENTS.md §3.5)
        # Cold renders must happen during the deploy, not for the first real
        # visitor/Googlebot; retries absorb the Error 1102 cold-render lottery.
        # Non-blocking: caches.default is per-colo, so a fresh CI colo is fully
        # cold and some cold renders exceed the 10ms CPU budget regardless of
        # retries — that is a signal for the render-path work, not a deploy
        # gate. Verify-headers below remains the gate.
        continue-on-error: true
        run: node scripts/warmup.mjs
        env:
          WARMUP_BASE_URL: https://podvarchan.com

      - name: Verify headers after deploy (site)
        # no-cache forces a fresh render, so a cold isolate can 1102 (503 with
        # no custom headers) even though the deployed worker is correct — the
        # same cold-render lottery the warmup step absorbs. Retry per URL:
        # a persistent header regression still fails all 4 attempts.
        run: |
          check_url() {
            u="$1"
            for attempt in 1 2 3 4; do
              h=$(curl -s -o /dev/null -D - --max-time 60 -H "Cache-Control: no-cache" "$u")
              code=$(printf '%s\n' "$h" | head -1 | awk '{print $2}')
              sig=$(printf '%s\n' "$h" | grep -ciE "^content-signal: ai-train=yes, search=yes, ai-input=yes" || true)
              if [[ "$u" == *"/api/preview/"* ]]; then
                cc=$(printf '%s\n' "$h" | grep -ciE "^cache-control:.*no-store" || true)
                [[ "$sig" == "1" && "$cc" == "1" ]] && { echo "OK $code $u (attempt $attempt)"; return 0; }
              else
                swr=$(printf '%s\n' "$h" | grep -ciE "^cache-control:.*stale-while-revalidate=" || true)
                sie=$(printf '%s\n' "$h" | grep -ciE "^cache-control:.*stale-if-error=" || true)
                [[ "$sig" == "1" && "$swr" == "1" && "$sie" == "1" ]] && { echo "OK $code $u (attempt $attempt)"; return 0; }
              fi
              echo "retry $attempt for $u (code=$code)"
              sleep 5
            done
            echo "FAIL: headers missing on $u after 4 attempts"; return 1
          }
          fail=0
          for u in "https://podvarchan.com/ru/" "https://podvarchan.com/ru/blog/" "https://podvarchan.com/sitemap.xml" "https://podvarchan.com/robots.txt" "https://podvarchan.com/llms.txt" "https://podvarchan.com/api/preview/"; do
            check_url "$u" || fail=1
          done
          exit $fail

  deploy-admin:
    name: Admin (admin.podvarchan.com)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/admin && npm install --no-audit --no-fund

      - name: Build admin
        run: cd apps/admin && npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADYZ2z3RysEsBoQu
          NEXTJS_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

      - name: TypeScript check (admin)
        run: cd apps/admin && npx tsc --noEmit
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTJS_ENV: production

      - name: Invalidation coverage check
        run: node scripts/check-invalidation-coverage.mjs
      - name: Bundle size gate (admin)
        # Same ~3 MiB gzip platform ceiling as the public worker; 1.8/2.5 MiB
        # leaves realistic headroom for admin UI growth (current ~1.42 MiB)
        # without alerting on every PR. 1.5/2.0 MiB proved too tight (~5%).
        run: node scripts/check-bundle-size.mjs --path apps/admin/.open-next/server-functions/default/apps/admin/handler.mjs --warn 1887436 --fail 2621440

      - name: Deploy admin to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin
          command: deploy --no-autoconfig

      - name: Verify admin responds
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Cache-Control: no-cache" https://admin.podvarchan.com/)
          echo "admin.podvarchan.com -> $code"
          [[ "$code" != "000" ]] || { echo "FAIL: admin unreachable"; exit 1; }
